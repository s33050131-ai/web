<!DOCTYPE html>

<t1>33050131黃雋晏九九乘法表</t1>
<title>九九乘法表</title>
<style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #333333;
      padding: 8px;
      text-align: left;
      background-color: aqua;
    }
  </style>
<script>
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
